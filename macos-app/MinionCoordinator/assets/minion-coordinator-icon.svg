<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">MinionCoordinator Icon</title>
  <desc id="desc">A menu-bar app icon showing a compact coordinator hub with linked agent nodes.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="hub" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="node" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="24" y="24" width="464" height="464" rx="112" fill="url(#bg)"/>

  <g opacity="0.14" fill="#ffffff">
    <circle cx="115" cy="102" r="9"/>
    <circle cx="403" cy="133" r="7"/>
    <circle cx="87" cy="380" r="8"/>
    <circle cx="426" cy="399" r="10"/>
    <circle cx="151" cy="443" r="6"/>
  </g>

  <g fill="none" stroke="#93c5fd" stroke-linecap="round" stroke-width="20" opacity="0.95">
    <path d="M154 176 L230 222"/>
    <path d="M358 176 L282 222"/>
    <path d="M154 336 L230 290"/>
    <path d="M358 336 L282 290"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="256" cy="256" r="84" fill="url(#hub)"/>
    <path d="M224 234 h64 a18 18 0 0 1 18 18 v38 a18 18 0 0 1 -18 18 h-64 a18 18 0 0 1 -18 -18 v-38 a18 18 0 0 1 18 -18 Z" fill="#0f172a"/>
    <circle cx="236" cy="271" r="12" fill="#60a5fa"/>
    <circle cx="276" cy="271" r="12" fill="#34d399"/>
    <rect x="242" y="194" width="28" height="26" rx="10" fill="#f59e0b"/>
  </g>

  <g filter="url(#shadow)">
    <circle cx="142" cy="160" r="38" fill="url(#node)"/>
    <circle cx="370" cy="160" r="38" fill="url(#node)"/>
    <circle cx="142" cy="352" r="38" fill="url(#node)"/>
    <circle cx="370" cy="352" r="38" fill="url(#node)"/>
  </g>

  <g fill="#ecfeff">
    <circle cx="142" cy="160" r="12"/>
    <circle cx="370" cy="160" r="12"/>
    <circle cx="142" cy="352" r="12"/>
    <circle cx="370" cy="352" r="12"/>
  </g>
</svg>
