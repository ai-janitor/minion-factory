[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "minion-factory"
version = "0.4.1"
description = "Unified multi-agent coordination framework — CLI, daemon, task DAG"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "pyyaml>=6.0",
    "watchdog>=4.0.0",
    "jinja2>=3.0",
]

[project.scripts]
minion = "minion.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/minion"]

[tool.hatch.build.targets.wheel.force-include]
"docs" = "minion/docs"
"missions" = "minion/missions"
"task-flows" = "minion/task-flows"
"src/minion/prompts/capabilities" = "minion/prompts/capabilities"
"src/minion/prompts/roles" = "minion/prompts/roles"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--junitxml=.work/test-reports/junit.xml -q"
markers = [
    "unit: Pure logic tests — no DB, no filesystem, no network. Fast.",
    "integration: Tests that touch DB, filesystem, or CLI runner. Medium speed.",
    "smoke: End-to-end flows that exercise multiple subsystems. Slowest.",
]

[tool.basedpyright]
pythonVersion = "3.10"
typeCheckingMode = "strict"

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
